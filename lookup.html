<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#82c9ee"><title>拼圖文創｜訂單查詢</title>
<style>
:root{--b:#82c9ee;--d:#247aa8;--p:#eef9fe;--i:#15384c;--m:#627b8a;--l:#d7eaf4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#eef9fe,#fff);color:var(--i);font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}header{max-width:900px;margin:auto;padding:22px 24px;display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:var(--b);color:#fff;font-weight:800}.brand b,.brand small{display:block}.brand small{font-size:10px;letter-spacing:.16em;color:var(--m)}.nav{margin-left:auto;display:flex;gap:8px}.nav a{padding:9px 12px;border-radius:10px;color:var(--d);text-decoration:none;font-size:14px;font-weight:750}.nav a.active{background:var(--p)}main{max-width:570px;margin:auto;padding:28px 18px 60px}.heading{text-align:center;margin-bottom:25px}.heading h1{margin:0}.heading p{margin:3px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:28px;box-shadow:0 20px 55px #2c759915}label{display:block;font-weight:700;margin:14px 0}input{display:block;width:100%;margin-top:7px;padding:14px;border:1px solid #cbdfe9;border-radius:12px;background:#fbfdff;font:inherit}.primary{width:100%;margin-top:10px;padding:15px;border:0;border-radius:13px;background:var(--d);color:#fff;font:800 16px inherit;cursor:pointer}.result{margin-top:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--l)}.row span{color:var(--m)}.status{display:block;text-align:center;margin:10px 0 18px;padding:14px;border-radius:14px;background:var(--p);color:var(--d);font-size:21px;font-weight:900}.hidden{display:none}.error{text-align:center;color:#d54b59;margin-top:15px}.notice{margin-top:16px;padding:12px;border-radius:12px;background:#fff8df;color:#7d651a;font-size:13px}@media(max-width:500px){header{padding:16px 14px}.brand small{display:none}.nav a{padding:8px}.card{padding:23px 18px}}
</style></head><body>
<header><div class="logo">拼</div><div class="brand"><b>拼圖文創</b><small>PUZZLE CREATIVE</small></div><nav class="nav"><a href="./">我要下單</a><a class="active" href="./lookup.html">查詢進度</a></nav></header>
<main><div class="heading"><h1>訂單進度查詢</h1><p>輸入下單時取得的需求編號</p></div><section class="card"><form id="form"><label>需求編號<input name="orderNumber" required placeholder="例：PZ260923-ABC123" autocapitalize="characters"></label><label>訂購手機號碼<input name="phone" required inputmode="tel" pattern="09[0-9]{8}" placeholder="09xxxxxxxx"></label><button class="primary">查詢訂單</button></form><p id="error" class="error hidden"></p><div id="result" class="result hidden"><span class="status" id="status"></span><div class="row"><span>需求編號</span><b id="number"></b></div><div class="row"><span>商品類型</span><b id="product"></b></div><div class="row"><span>物流單號</span><b id="tracking"></b></div><div class="row"><span>最後更新</span><b id="updated"></b></div></div><div class="notice">免費測試版僅能在原本下單的同一台裝置與瀏覽器查詢。</div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),form=document.querySelector("#form"),result=document.querySelector("#result"),error=document.querySelector("#error");
form.addEventListener("submit",async e=>{e.preventDefault();const btn=e.submitter,number=form.orderNumber.value.trim().toUpperCase(),phone=form.phone.value.trim();btn.disabled=true;error.classList.add("hidden");result.classList.add("hidden");try{if(!auth.currentUser)await signInAnonymously(auth);const saved=JSON.parse(localStorage.getItem("puzzleOrders")||"{}"),id=saved[number];if(!id)throw Error("not-on-device");const snap=await getDoc(doc(db,"orders",id));if(!snap.exists())throw Error("not-found");const d=snap.data();if(d.orderNumber!==number||d.phone!==phone)throw Error("mismatch");document.querySelector("#status").textContent=d.status||"待確認";document.querySelector("#number").textContent=d.orderNumber;document.querySelector("#product").textContent=d.productType||"—";document.querySelector("#tracking").textContent=d.trackingNumber||"尚未提供";document.querySelector("#updated").textContent=d.updatedAt?.toDate?d.updatedAt.toDate().toLocaleString("zh-TW"):(d.createdAt?.toDate?d.createdAt.toDate().toLocaleString("zh-TW"):"剛剛");result.classList.remove("hidden")}catch(x){console.error(x);error.textContent="查無訂單。請確認需求編號、手機號碼，並使用原本下單的裝置與瀏覽器。";error.classList.remove("hidden")}finally{btn.disabled=false}});
</script></body></html>
