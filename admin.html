<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#82c9ee"><title>拼圖文創｜訂單後台</title>
<style>
:root{--b:#82c9ee;--d:#247aa8;--p:#eef9fe;--i:#15384c;--m:#627b8a;--l:#d7eaf4;--r:#e75d6a}*{box-sizing:border-box}body{margin:0;background:#f5fbfe;color:var(--i);font:15px/1.6 system-ui,"Noto Sans TC",sans-serif}header{position:sticky;top:0;z-index:2;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--l)}header>div,main{max-width:1100px;margin:auto;padding:16px 20px}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:19px;font-weight:800}.brand span{color:var(--d)}button,input,select{font:inherit}button{cursor:pointer;border:0}.secondary{padding:9px 13px;border-radius:10px;background:var(--p);color:var(--d);font-weight:700}main{padding-top:28px}.login{max-width:430px;margin:8vh auto;background:#fff;border:1px solid var(--l);border-radius:24px;padding:30px;box-shadow:0 20px 50px #2c759915}.login h1{margin:0 0 5px}.login p{color:var(--m)}label{display:block;font-weight:650;margin:15px 0}input,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cbdfe9;border-radius:11px;background:#fbfdff;color:var(--i)}.primary{width:100%;padding:14px;border-radius:12px;background:var(--d);color:#fff;font-weight:800}.tools{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:18px}.stats{display:flex;gap:10px;overflow:auto;margin-bottom:18px}.stat{min-width:115px;background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px}.stat b{display:block;font-size:22px;color:var(--d)}.orders{display:grid;gap:13px}.order{background:#fff;border:1px solid var(--l);border-radius:18px;padding:19px}.top{display:flex;justify-content:space-between;gap:15px}.num{font-weight:800;color:var(--d)}.muted{color:var(--m);font-size:13px}.badge{height:max-content;padding:5px 10px;border-radius:99px;background:var(--p);color:var(--d);font-size:13px;font-weight:800}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.info div{background:#f8fcfe;border-radius:11px;padding:10px}.details{white-space:pre-wrap;border-left:3px solid var(--b);padding-left:12px}.edit{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:15px}.edit label{margin:0}.save,.archive{padding:12px 16px;border-radius:11px;color:#fff;font-weight:800}.save{background:var(--d)}.archive{background:#e75d6a}.restore{background:#58a879}.empty{text-align:center;padding:50px;color:var(--m)}.hidden{display:none!important}@media(max-width:700px){.tools,.info,.edit{grid-template-columns:1fr}.top{align-items:flex-start}.order{padding:16px}}
</style></head><body>
<header><div class="bar"><div class="brand">拼圖文創 <span>訂單後台</span></div><button id="logout" class="secondary hidden">登出</button></div></header>
<main>
<section id="login" class="login"><h1>管理員登入</h1><p>登入後即可查看與更新客製訂單。</p><form id="loginForm"><label>電子郵件<input name="email" type="email" required autocomplete="username"></label><label>密碼<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">登入後台</button></form></section>
<section id="panel" class="hidden"><div class="tools"><input id="search" placeholder="搜尋編號、姓名、電話或 LINE 名稱"><select id="filter"><option value="">全部狀態</option><option>待確認</option><option>製作中</option><option>已出貨</option><option>已完成</option><option>已取消</option><option value="__trash">垃圾桶</option></select></div><div id="stats" class="stats"></div><div id="orders" class="orders"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,orderBy,query,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),login=document.querySelector("#login"),panel=document.querySelector("#panel"),ordersEl=document.querySelector("#orders"),logout=document.querySelector("#logout");let all=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await signInWithEmailAndPassword(auth,e.target.email.value,e.target.password.value)}catch(x){alert("登入失敗，請確認帳號、密碼與管理員權限。")}finally{b.disabled=false}});
logout.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){login.classList.remove("hidden");panel.classList.add("hidden");logout.classList.add("hidden");return}const permit=await getDoc(doc(db,"admins",user.uid));if(!permit.exists()){alert("這個帳號尚未設定為管理員。");await signOut(auth);return}login.classList.add("hidden");panel.classList.remove("hidden");logout.classList.remove("hidden");await load()});
async function load(){ordersEl.innerHTML='<div class="empty">讀取訂單中…</div>';try{const snap=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc")));all=snap.docs.map(x=>({id:x.id,...x.data()}));render()}catch(x){console.error(x);ordersEl.innerHTML='<div class="empty">讀取失敗，請檢查 Firestore 規則是否已更新。</div>'}}
function render(){const term=document.querySelector("#search").value.trim().toLowerCase(),status=document.querySelector("#filter").value,shown=all.filter(o=>{const location=status==="__trash"?o.archived:!o.archived;return location&&(!status||status==="__trash"||o.status===status)&&(!term||[o.orderNumber,o.customerName,o.phone,o.lineName].some(v=>String(v||"").toLowerCase().includes(term)))});const active=all.filter(o=>!o.archived),counts={全部:active.length};for(const o of active)counts[o.status]=(counts[o.status]||0)+1;counts["垃圾桶"]=all.filter(o=>o.archived).length;document.querySelector("#stats").innerHTML=Object.entries(counts).map(([k,v])=>'<div class="stat"><span>'+esc(k)+'</span><b>'+v+'</b></div>').join("");ordersEl.innerHTML=shown.length?shown.map(card).join(""):'<div class="empty">沒有符合的訂單</div>';ordersEl.querySelectorAll(".save").forEach(b=>b.onclick=()=>save(b.dataset.id));ordersEl.querySelectorAll(".archive").forEach(b=>b.onclick=()=>archiveOrder(b.dataset.id))}
function card(o){const date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("zh-TW"):"剛剛";return '<article class="order"><div class="top"><div><div class="num">'+esc(o.orderNumber)+'</div><b>'+esc(o.customerName)+' · '+esc(o.productType)+'</b><div class="muted">'+esc(date)+'</div></div><span class="badge">'+esc(o.status)+'</span></div><div class="info"><div><span class="muted">電話</span><br>'+esc(o.phone)+'</div><div><span class="muted">LINE</span><br>'+esc(o.lineName)+'</div><div><span class="muted">數量／取貨</span><br>'+esc(o.quantity)+'／'+esc(o.deliveryMethod)+'</div></div><p class="details">'+esc(o.details)+'</p><div class="muted">規格：'+esc(o.specification||"—")+'　地址：'+esc(o.address||"—")+'　付款：'+esc(o.paymentMethod||"—")+'</div><div class="edit"><label>訂單狀態<select class="status"><option '+(o.status==="待確認"?"selected":"")+'>待確認</option><option '+(o.status==="製作中"?"selected":"")+'>製作中</option><option '+(o.status==="已出貨"?"selected":"")+'>已出貨</option><option '+(o.status==="已完成"?"selected":"")+'>已完成</option><option '+(o.status==="已取消"?"selected":"")+'>已取消</option></select></label><label>物流單號<input class="tracking" value="'+esc(o.trackingNumber||"")+'" placeholder="尚未出貨可留空"></label><div><button class="save" data-id="'+esc(o.id)+'">儲存</button> <button class="archive '+(o.archived?"restore":"")+'" data-id="'+esc(o.id)+'">'+(o.archived?"還原":"移到垃圾桶")+'</button></div></div></article>'}
async function save(id){const el=[...ordersEl.querySelectorAll(".save")].find(x=>x.dataset.id===id),box=el.closest(".order"),o=all.find(x=>x.id===id),status=box.querySelector(".status").value,trackingNumber=box.querySelector(".tracking").value.trim();el.disabled=true;try{await updateDoc(doc(db,"orders",id),{status,trackingNumber,updatedAt:serverTimestamp()});if(o.lookupId)await updateDoc(doc(db,"publicOrderStatuses",o.lookupId),{status,trackingNumber,updatedAt:serverTimestamp()});o.status=status;o.trackingNumber=trackingNumber;render();alert("訂單已更新")}catch(x){console.error(x);alert("更新失敗，請稍後再試")}finally{el.disabled=false}}
async function archiveOrder(id){const o=all.find(x=>x.id===id),restoring=!!o.archived,msg=restoring?"要把這筆訂單還原到正常清單嗎？":"確定將這筆訂單移到垃圾桶嗎？客人的查詢狀態會顯示為已取消。";if(!confirm(msg))return;try{const patch=restoring?{archived:false,status:"待確認",updatedAt:serverTimestamp()}:{archived:true,status:"已取消",archivedAt:serverTimestamp(),updatedAt:serverTimestamp()};await updateDoc(doc(db,"orders",id),patch);Object.assign(o,patch);render()}catch(x){console.error(x);alert("操作失敗，請稍後再試")}}document.querySelector("#search").oninput=render;document.querySelector("#filter").onchange=render;
</script></body></html>
